[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-question-bank"
version = "0.2.0"
description = "Stateful autonomous agent that solves question banks in controlled batches grounded in study notes, extracts high-yield topics, and compiles a final answer key."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
]
docs = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]
web = [
    "streamlit>=1.36.0",
]
all = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "streamlit>=1.36.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
aqb = "aqb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
